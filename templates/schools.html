<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Schools | Parho Multan</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body>
<header class="header"><a class="brand" href="/"><img src="{{ url_for('static',filename='logo.jpg') }}"></a><nav><a href="/schools">Schools</a><a href="/#areas">Areas</a><a href="/#about">About</a></nav></header>
<main class="page"><span class="eyebrow">SCHOOL DIRECTORY</span><h1>Schools in Multan</h1>
<form class="filters" method="get"><input name="q" value="{{ query }}" placeholder="Search school or school group..."><button>Search</button></form>
<div class="cards">{% for school in schools %}<a class="school-card school-card-clickable" href="/school/{{ school.id }}"><div class="school-logo-box"><img src="{{ url_for('static',filename=school.logo) }}"></div><h3>{{ school.name }}</h3><p class="branch-count">{{ school.branches|length }} branch{% if school.branches|length != 1 %}es{% endif %}</p><div class="card-bottom">View branches <span>→</span></div></a>{% else %}<div class="empty"><h2>No schools found</h2></div>{% endfor %}</div></main></body></html>
